name: AOT Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore

      - name: Publish AOT
        run: dotnet publish src/WinForward.Cli/WinForward.Cli.csproj -c Release --no-restore -r win-x64

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WinForward-win-x64
          path: src/WinForward.Cli/bin/Release/net10.0/win-x64/publish/
          if-no-files-found: error
